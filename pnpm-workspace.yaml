# Which dependencies may run install scripts: true compiles a native addon, false skips a script
# the project does not need. A package left out here stops the install with ERR_PNPM_IGNORED_BUILDS.
# pnpm 11 reads this from pnpm-workspace.yaml only; see https://pnpm.io/settings/build.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  oracledb: true
  tesseract.js: false

# Skips re-auditing lockfile entries against the supply-chain policy on every install.
# The check costs tens of seconds here and re-verifies versions the lockfile already pins;
# newly resolved packages are still checked. Set to false if outside contributors edit the
# lockfile. See https://pnpm.io/settings/dependency-resolution#trustlockfile.
trustLockfile: true

# Reports a dependency whose install script was skipped as a warning instead of failing the
# install. allowBuilds above decides the packages known today; this keeps a new transitive
# dependency from stopping the install with a red error before anything is even running.
# See https://pnpm.io/settings/build#strictdepbuilds.
strictDepBuilds: false

minimumReleaseAgeExclude:
  - '@nocobase/app-plugin-authentication@2.0.0-beta.16'
  - '@nocobase/app-cli@1.0.0-beta.30'
  - '@nocobase/app-client@4.0.0-beta.5'
  - '@nocobase/app-server@3.0.0-beta.5'
  - '@nocobase/db@1.0.0-beta.24'
  - '@nocobase/jobs@1.0.0-beta.5'
  - '@nocobase/queue@1.0.0-beta.10'
  - '@nocobase/lifecycle@0.1.0-beta.4'
  - '@nocobase/mailer@0.1.0-beta.1'
  - '@nocobase/app-plugin-agents@2.0.0-beta.0'
  - '@nocobase/app-plugin-authorization@1.0.0-beta.33'
  - '@nocobase/app-plugin-demo-mode@0.2.0-beta.6'
  - '@nocobase/app-plugin-mail@1.0.0-beta.18'
  - '@nocobase/app-plugin-notification@2.0.0-beta.2'
  - '@nocobase/app-plugin-scheduler@1.0.0-beta.21'
  - '@nocobase/app-plugin-users@2.0.0-beta.11'
  - '@nocobase/agent-protocol@0.1.0-beta.16'
  - '@nocobase/api-client@1.0.0-beta.6'
  - '@nocobase/app-cli-client@0.1.0-beta.17'

# Match Agents 2.0.0-beta.0 and ai 7.0.128; Ollama otherwise resolves a newer incompatible SDK.
overrides:
  ollama-ai-provider-v2>@ai-sdk/provider-utils: 5.0.54
