<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1760 1540">
  <!-- The NocoBase mark, light or dark with the browser (2026-10-20): the
       .ico is black only and disappears on a dark tab bar. -->
  <style>
    .ink { fill: #000; stroke: #000; }
    .face { fill: #fff; stroke: #000; }
